name: morning-bets
on:
  schedule:
    - cron: "0 */3 * * *"  # Every 3h UTC; open pre-kickoff bets can be rebalanced
  workflow_dispatch: {}
concurrency: { group: state-writes, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  bets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run bets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          X_APP_KEY: ${{ secrets.X_APP_KEY }}
          X_APP_SECRET: ${{ secrets.X_APP_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - name: Commit state
        run: |
          git config user.name "wc-bot"
          git config user.email "wc-bot@users.noreply.github.com"
          git add data site/public/og.png
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: bets $(date -u +%F)"
          git pull --rebase && git push
