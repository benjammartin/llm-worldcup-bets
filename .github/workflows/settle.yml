name: settle-poller
on:
  schedule:
    - cron: "*/30 15-23 * * *"  # match windows, UTC (NA kickoffs)
    - cron: "*/30 0-7 * * *"
  workflow_dispatch: {}
concurrency: { group: state-writes, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run settle
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          X_APP_KEY: ${{ secrets.X_APP_KEY }}
          X_APP_SECRET: ${{ secrets.X_APP_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - name: Commit state
        run: |
          git config user.name "wc-bot"
          git config user.email "wc-bot@users.noreply.github.com"
          git add data site/public/og.png
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: settle $(date -u +%FT%H:%M)"
          git pull --rebase && git push
